version: "3.8"

services:
  shield-proxy-active:
    build:
      context: ..
      dockerfile: arkachat-proxy/Dockerfile
    ports:
      - "8443:8443"
      - "5353:5353/udp"
      - "9090:9090"
    volumes:
      - ./shield-proxy.toml:/etc/shield-proxy/config.toml:ro
    env_file:
      - .env
    environment:
      RUST_LOG: info
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/shield-proxy", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  shield-proxy-standby:
    build:
      context: ..
      dockerfile: arkachat-proxy/Dockerfile
    volumes:
      - ./shield-proxy-standby.toml:/etc/shield-proxy/config.toml:ro
    env_file:
      - .env
    environment:
      RUST_LOG: info
    restart: on-failure
    depends_on:
      shield-proxy-active:
        condition: service_healthy
