name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'arkachat-web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'arkachat-web/**'
      - '.github/workflows/ci-web.yml'

# F10: least-privilege token; actions pinned to commit SHAs (mutable tags can be retargeted).
permissions:
  contents: write

jobs:
  build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: arkachat-web/package-lock.json

      - name: Stub local Shield package for CI
        # @dikestra/shield points to ../../Shield/javascript (sibling repo).
        # Replace with an empty stub so npm install succeeds in CI.
        run: |
          PKG='arkachat-web/package.json'
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('$PKG', 'utf8'));
            delete pkg.dependencies['@dikestra/shield'];
            fs.writeFileSync('$PKG', JSON.stringify(pkg, null, 2));
          "

      - name: Install dependencies
        run: npm ci
        working-directory: arkachat-web

      - name: Lint
        run: npm run lint
        working-directory: arkachat-web

      - name: Build
        run: npm run build
        working-directory: arkachat-web
        env:
          # Skip TypeScript strict errors that reference Shield types in CI
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arkachat-web-build
          path: arkachat-web/.next
          if-no-files-found: warn

      - name: Gibraltar-Task — track CI result
        if: always()
        uses: ./.github/actions/gibraltar-task-issue
        with:
          status: ${{ job.status }}
          workflow: web
          area: frontend
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
