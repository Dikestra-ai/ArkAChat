name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# F6/F10: least privilege by default; only the publish job gets contents:write.
# All actions pinned to full commit SHAs (mutable tags can be retargeted).
permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        working-directory: arkachat-android

      # F6: releases must ship a SIGNED APK. Required repository secrets:
      #   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
      #   ANDROID_KEYSTORE_PASSWORD keystore password
      #   ANDROID_KEY_ALIAS         key alias
      #   ANDROID_KEY_PASSWORD      key password
      # The job FAILS (rather than shipping app-release-unsigned.apk) when the
      # signing secrets are not configured.
      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured — refusing to publish an unsigned release APK."
            exit 1
          fi
          KEYSTORE="${RUNNER_TEMP}/release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="${RUNNER_TEMP}/app-release-aligned.apk"
          SIGNED=app/build/outputs/apk/release/app-release.apk
          "${BUILD_TOOLS}/zipalign" -f 4 "${UNSIGNED}" "${ALIGNED}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${SIGNED}" \
            "${ALIGNED}"
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${SIGNED}"
          rm -f "${KEYSTORE}" "${ALIGNED}" "${UNSIGNED}"
        working-directory: arkachat-android

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: arkachat-android/app/build/outputs/apk/release/app-release.apk

  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            electron_args: '--linux'
            path: 'arkachat-desktop/dist/*.AppImage'
            artifact: release-linux

          - os: macos-latest
            name: macOS
            electron_args: '--mac'
            path: 'arkachat-desktop/dist/*.dmg'
            artifact: release-macos

          - os: windows-latest
            name: Windows
            electron_args: '--win'
            path: 'arkachat-desktop/dist/*.exe'
            artifact: release-windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            arkachat-web/package-lock.json
            arkachat-desktop/package-lock.json

      - name: Stub Shield for CI
        shell: bash
        run: |
          PKG='arkachat-web/package.json'
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('$PKG', 'utf8'));
            delete pkg.dependencies['@dikestra/shield'];
            fs.writeFileSync('$PKG', JSON.stringify(pkg, null, 2));
          "

      - run: npm ci
        working-directory: arkachat-web

      - name: Build web renderer
        run: npm run build
        working-directory: arkachat-web
        env:
          BUILD_TARGET: electron
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Copy renderer
        shell: bash
        run: mkdir -p arkachat-desktop/renderer && cp -r arkachat-web/out/. arkachat-desktop/renderer/

      - run: npm ci
        working-directory: arkachat-desktop

      - name: Build ${{ matrix.name }} release
        run: npx electron-builder ${{ matrix.electron_args }} --publish=never
        working-directory: arkachat-desktop
        env:
          # Desktop binaries are NOT code-signed yet (needs Apple Developer ID /
          # Windows Authenticode certs — ops). Until then, users must verify the
          # published SHA256SUMS; do not claim these are signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    # Only this job may write repo contents (create the release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd release-artifacts
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ArkAChat ${{ github.ref_name }}
          body: |
            ## ArkAChat ${{ github.ref_name }}

            Quantum-resistant messaging by Dikestra AI — powered by Shield encryption.

            ### Downloads
            | Platform | File | Signed |
            |----------|------|--------|
            | Android  | `app-release.apk` | Yes — ArkAChat release key (verify with `apksigner verify --print-certs`) |
            | Linux    | `.AppImage` | No — verify `SHA256SUMS` |
            | macOS    | `.dmg` | No — verify `SHA256SUMS` |
            | Windows  | `.exe` | No — verify `SHA256SUMS` |

            Verify any download against `SHA256SUMS`:
            `sha256sum -c SHA256SUMS --ignore-missing`

            ### What's changed
            See [CHANGELOG](https://github.com/Dikestra-ai/ArkAChat/commits/main) for full history.
          files: |
            release-artifacts/**
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
