name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        working-directory: arkachat-android

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: arkachat-android/app/build/outputs/apk/release/app-release-unsigned.apk

  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            electron_args: '--linux'
            path: 'arkachat-desktop/dist/*.AppImage'
            artifact: release-linux

          - os: macos-latest
            name: macOS
            electron_args: '--mac'
            path: 'arkachat-desktop/dist/*.dmg'
            artifact: release-macos

          - os: windows-latest
            name: Windows
            electron_args: '--win'
            path: 'arkachat-desktop/dist/*.exe'
            artifact: release-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stub Shield for CI
        shell: bash
        run: |
          PKG='arkachat-web/package.json'
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('$PKG', 'utf8'));
            delete pkg.dependencies['@dikestra/shield'];
            fs.writeFileSync('$PKG', JSON.stringify(pkg, null, 2));
          "

      - run: npm ci
        working-directory: arkachat-web

      - name: Build web renderer
        run: npm run build
        working-directory: arkachat-web
        env:
          BUILD_TARGET: electron
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Copy renderer
        shell: bash
        run: mkdir -p arkachat-desktop/renderer && cp -r arkachat-web/out/. arkachat-desktop/renderer/

      - run: npm ci
        working-directory: arkachat-desktop

      - name: Build ${{ matrix.name }} release
        run: npx electron-builder ${{ matrix.electron_args }} --publish=never
        working-directory: arkachat-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArkAChat ${{ github.ref_name }}
          body: |
            ## ArkAChat ${{ github.ref_name }}

            Quantum-resistant messaging by Dikestra AI — powered by Shield encryption.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Android  | `app-release-unsigned.apk` |
            | Linux    | `.AppImage` |
            | macOS    | `.dmg` |
            | Windows  | `.exe` |

            ### What's changed
            See [CHANGELOG](https://github.com/Dikestra-ai/ArkAChat/commits/main) for full history.
          files: release-artifacts/**
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
