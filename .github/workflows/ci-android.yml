name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'arkachat-android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'arkachat-android/**'
      - '.github/workflows/ci-android.yml'

# F10: least-privilege token; actions pinned to commit SHAs (mutable tags can be retargeted).
# attestations + id-token are required for SLSA provenance attestation on uploaded artifacts.
permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        # ubuntu-latest has Android SDK pre-installed; accept licenses non-interactively.
        # android-actions/setup-android@v3 tries to install the deprecated 'tools' package
        # which was removed from sdkmanager, so we rely on the pre-installed SDK instead.
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: arkachat-android

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        working-directory: arkachat-android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: arkachat-android

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arkachat-debug
          path: arkachat-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # SLSA build provenance: ties the artifact to this exact commit + build
      # environment, enabling users to verify the APK was produced by this
      # workflow and was not substituted in transit. Verifiable with:
      #   gh attestation verify app-debug.apk --repo Dikestra-ai/ArkAChat
      - name: Attest build provenance
        if: steps.upload-apk.outputs.artifact-id != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: arkachat-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Gibraltar-Task — track CI result
        if: always()
        uses: ./.github/actions/gibraltar-task-issue
        with:
          status: ${{ job.status }}
          workflow: android
          area: backend
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
