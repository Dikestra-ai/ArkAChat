name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'arkachat-android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'arkachat-android/**'
      - '.github/workflows/ci-android.yml'

# F10: least-privilege token; actions pinned to commit SHAs (mutable tags can be retargeted).
permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: arkachat-android

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        working-directory: arkachat-android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: arkachat-android

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arkachat-debug
          path: arkachat-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Gibraltar-Task — track CI result
        if: always()
        uses: ./.github/actions/gibraltar-task-issue
        with:
          status: ${{ job.status }}
          workflow: android
          area: backend
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
