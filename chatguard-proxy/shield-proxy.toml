# ChatGuard Shield Proxy Configuration
# Routes SimpleX WebSocket traffic through Shield transport encryption

[proxy]
bind_address = "0.0.0.0:8443"
max_connections = 10000
shutdown_timeout_secs = 30

[dns]
bind_address = "0.0.0.0:5353"
timeout_ms = 2000
health_check_interval_secs = 10

[[dns.upstreams]]
address = "8.8.8.8:53"
priority = 1

[[dns.upstreams]]
address = "1.1.1.1:53"
priority = 2

[[upstream]]
name = "smp4-simplex"
address = "smp4.simplex.im:5223"
protocol = "tcp"
shield_encrypt = true
shield_key = "${SHIELD_PROXY_KEY_SMP4}"

[[upstream]]
name = "smp5-simplex"
address = "smp5.simplex.im:5223"
protocol = "tcp"
shield_encrypt = true
shield_key = "${SHIELD_PROXY_KEY_SMP5}"

[[upstream]]
name = "smp6-simplex"
address = "smp6.simplex.im:5223"
protocol = "tcp"
shield_encrypt = true
shield_key = "${SHIELD_PROXY_KEY_SMP6}"

[shield]
password = "${SHIELD_PROXY_PASSWORD}"
service = "chatguard-proxy"
replay_ttl_secs = 60

[metrics]
enabled = true
bind_address = "0.0.0.0:9090"
path = "/metrics"

[logging]
level = "info"
format = "text"
